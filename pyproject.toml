[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clawmetry-jumper"
version = "0.1.0"
description = "Mizu desk companion demo using built-in ClawMetry Physical AI observation"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["clawmetry>=0.12.930", "duckdb>=1.1"]

[project.optional-dependencies]
sim = ["mujoco==3.11.0", "numpy>=2.0", "onnxruntime>=1.17", "pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
clawmetry-jumper = "clawmetry_jumper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
